services:
  ollama:
    image: ollama/ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollim-bot:
    build: .
    env_file: .env
    volumes:
      - bot_data:/home/bot/.ollim-bot
      - cli_data:/home/bot/.claude
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_data:
  bot_data:
  cli_data:
